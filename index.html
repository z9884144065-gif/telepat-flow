<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💱 P2P Автоматизация — ДЕМО</title>
<style>
:root{--bg:#0b1018;--card:#141c28;--line:#39475b;--gold:#f4cf70;--text:#fff;--muted:#9da9b9;--green:#39d98a;--red:#ff647c;--blue:#4f8cff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#26334a 0,#0b1018 42%),#0b1018;color:var(--text);font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.app{max-width:600px;margin:auto;padding:14px 12px 30px}
h1{text-align:center;color:var(--gold);margin:6px 0 2px;font-size:22px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.card{background:linear-gradient(145deg,#1b2636,#111925);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 10px 24px #0006}
.card.gold{border-color:#80652b}
.title{color:var(--gold);font-size:13px;font-weight:bold;letter-spacing:.6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button{padding:13px;border-radius:13px;border:0;background:linear-gradient(135deg,#f5d477,#c99629);color:#17120a;font-weight:bold;font-size:15px;cursor:pointer}
button.ok{background:linear-gradient(135deg,#39d98a,#2ba86a);color:#0d280d;width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
input{width:100%;padding:11px;border-radius:12px;border:1px solid #45536a;background:#0d1520;color:#fff;font-size:15px;outline:none}
label{display:block;color:#aeb8c6;font-size:11px;margin-bottom:5px;margin-top:8px}
.info{color:var(--muted);font-size:12px;line-height:1.45}
.ok{color:var(--green)}.er{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}

/* Курс */
.price-wrap{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:4px 0}
.price-big{font-size:48px;font-weight:bold;color:#fff;line-height:1;letter-spacing:-1.5px;transition:color .3s}
.price-big.up{color:#39d98a;text-shadow:0 0 24px #39d98a88}
.price-unit{color:#8f9bab;font-size:16px}
.price-meta{display:flex;justify-content:space-between;font-size:12px;padding:0 6px;margin-top:4px}

/* Стат */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#0d1520;border:1px solid #2d3a4c;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;color:#fff;margin-top:2px;line-height:1.1}
.stat span{color:#8f9bab;font-size:10px;letter-spacing:.4px}
.stat.g b{color:#39d98a}
.prof-name{font-size:15px;font-weight:bold;color:var(--gold);text-align:center;margin-bottom:10px}

/* Форма ордера */
.side-toggle{display:flex;gap:6px;margin-bottom:8px}
.side-btn{flex:1;padding:11px;font-size:12px;font-weight:bold;border-radius:12px;border:1px solid #45536a;background:#0d1520;color:#9da9b9;cursor:pointer;transition:.15s}
.side-btn.buy.active{background:linear-gradient(145deg,#1f4a2f,#0d2818);color:#39d98a;border-color:#39d98a;box-shadow:0 0 14px #39d98a55}
.side-btn.sell.active{background:linear-gradient(145deg,#4a1f2f,#280d18);color:#ff647c;border-color:#ff647c;box-shadow:0 0 14px #ff647c55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{background:#0d1520;border:1px solid #303d50;border-radius:12px;padding:10px;text-align:center;font-size:13px;color:#8f9bab;margin:10px 0}
.preview b{color:#f4cf70;font-size:15px}

/* Книга */
.book-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.bh{font-size:11px;font-weight:bold;letter-spacing:.6px;padding:6px;border-radius:8px;text-align:center}
.bh.sell{background:#4a1f2f;color:#ff647c}
.bh.buy{background:#1f4a2f;color:#39d98a}
.book{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:220px;max-height:340px}
.col{display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.empty{color:#4a596d;text-align:center;font-size:11px;padding:20px 6px;grid-column:1/-1}
.order{position:relative;padding:7px 9px;border-radius:9px;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid transparent;transition:opacity .3s, transform .2s}
.order.sell{background:linear-gradient(145deg,#2a1515,#1a0d0d);border-color:#4a2424;color:#ffb3b3}
.order.buy{background:linear-gradient(145deg,#152a1f,#0d1a13);border-color:#244a34;color:#a8e6b9}
.order.mine{border-color:var(--gold);box-shadow:0 0 10px #f4cf7055}
.order .l{flex:1;min-width:0}
.order .p{font-weight:bold;font-size:12px}
.order .a{font-size:10px;color:#8f9bab;margin-top:1px}
.order .x{cursor:pointer;color:#8f9bab;font-weight:bold;font-size:14px;padding:0 4px}
.order .x:hover{color:#ff647c}
.order.flash{animation:flashSell .4s}
@keyframes flashSell{0%{background:#39d98a;color:#000}100%{background:transparent}}

/* Лог */
.log-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow-y:auto;font-size:11px}
.log-line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a2534}
.log-line:last-child{border:0}
.log-line .tm{color:#7f8c9f;margin-right:6px}

.toast{position:fixed;left:12px;right:12px;top:12px;z-index:4000;padding:12px;border-radius:12px;background:#1b2737;border:1px solid #4c5b70;text-align:center;font-size:13px;display:none}
.toast.show{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div class="app">
  <h1>💱 P2P АВТОМАТИЗАЦИЯ</h1>
  <div class="sub">ДЕМО • Телепат • Живой рынок</div>

  <!-- КУРС -->
  <div class="card gold">
    <div class="title">📈 КУРС TG → TUSD</div>
    <div class="price-wrap">
      <div class="price-big" id="priceDisplay">100.00</div>
      <div class="price-unit">TUSD</div>
    </div>
    <div class="price-meta">
      <span class="ok">▲ +1.0% / день</span>
      <span class="info">До роста: <b id="growthTimer">30</b> сек</span>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="card gold">
    <div class="title">👤 ПРОФИЛЬ</div>
    <div class="prof-name" id="profName">Крестьянин</div>
    <div class="stats">
      <div class="stat"><span>TG</span><b id="balTG">100</b></div>
      <div class="stat"><span>TUSD</span><b id="balUSD">1000</b></div>
      <div class="stat g"><span>ЗАРАБОТАНО</span><b id="earned">0.00</b></div>
    </div>
    <div class="info" style="text-align:center;margin-top:8px">
      Комиссия: <b id="commRate" style="color:#f4cf70">1.0%</b> • Макс. ордер: <b id="maxOrd" style="color:#4f8cff">10</b> $
    </div>
  </div>

  <!-- НОВЫЙ ОРДЕР -->
  <div class="card">
    <div class="title">📝 НОВЫЙ ОРДЕР</div>
    <div class="side-toggle">
      <button id="btnBuy" class="side-btn buy active" onclick="setSide('buy')">🟩 КУПИТЬ TG</button>
      <button id="btnSell" class="side-btn sell" onclick="setSide('sell')">🟥 ПРОДАТЬ TG</button>
    </div>
    <div class="grid2">
      <div>
        <label>Цена за 1 TG</label>
        <input id="ordPrice" type="number" step="0.01" value="100">
      </div>
      <div>
        <label>Кол-во TG</label>
        <input id="ordAmount" type="number" step="1" value="5" min="1">
      </div>
    </div>
    <div class="preview">Итого: <b id="ordTotal">500.00</b> TUSD</div>
    <button class="ok" id="submitBtn" onclick="submitOrder()">🚀 РАЗМЕСТИТЬ ОРДЕР</button>
  </div>

  <!-- КНИГА -->
  <div class="card">
    <div class="title">📖 КНИГА ОРДЕРОВ<span class="info" style="font-size:11px">● Live</span></div>
    <div class="book-head">
      <div class="bh sell">SELL 🟥</div>
      <div class="bh buy">BUY 🟩</div>
    </div>
    <div class="book">
      <div class="col" id="sellBook"></div>
      <div class="col" id="buyBook"></div>
    </div>
  </div>

  <!-- ЛОГ -->
  <div class="card">
    <div class="title">⚡ ЛЕНТА СДЕЛОК</div>
    <div id="logList" class="log-list"><div class="info" style="text-align:center;padding:10px">Ждём первых сделок…</div></div>
  </div>
</div>

<script>
/* ============== ДАННЫЕ ============== */
const RANKS = ['Крестьянин','Вольный','Гражданин','Оруженосец','Мечник','Десятник','Сотник','Тысячник','Рыцарь','Железный рыцарь','Бронзовый рыцарь','Серебряный рыцарь','Золотой рыцарь','Барон','Виконт','Граф','Маркиз','Герцог','Князь','Король','Император'];
const MAX_ORDER = [10,23,44,80,145,265,480,870,1580,2870,5200,9450,17200,31200,56700,103000,187000,340000,618000,1123000,2040000];
const BOT_NAMES = ['Вася','Петя','Иван','Маша','Олег','Коля','Аня','Дима','Катя','Саша','Лена','Гриша'];

/* ============== СОСТОЯНИЕ ============== */
const S = {
  level: 1,
  price: 100,
  nextGrowthAt: Date.now() + 30000,
  balTG: 100,
  balUSD: 1000,
  earned: 0,
  myFilled: 0,
  orders: [],
  log: [],
  side: 'buy',
};

/* ============== УТИЛИТЫ ============== */
function limitOf(lvl){ return 9 + lvl; }
function rateOf(lvl){ return (9 + lvl) / 10; }
function maxOrderOf(lvl){ return MAX_ORDER[Math.min(20, Math.max(0, lvl - 1))]; }
function fmt(v, d=2){ return Number(v).toFixed(d); }
function fmtBig(v){
  const n = Number(v);
  if(n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.?0+$/,'') + 'K';
  return String(Math.round(n*100)/100);
}
function toast(t, ok=false){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.style.borderColor = ok ? '#397b5b' : '#4c5b70';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2000);
}
function uid(){ return 'o' + Math.random().toString(36).slice(2, 10); }

/* ============== БОТЫ (другие игроки) ============== */
function botOrder(){
  const side = Math.random() < 0.5 ? 'buy' : 'sell';
  const mid = S.price;
  let price;
  if(side === 'sell') price = mid * (1 + Math.random() * 0.04);      // продают дороже
  else                price = mid * (1 - Math.random() * 0.04);      // покупают дешевле
  price = Math.round(price * 100) / 100;
  const amount = 1 + Math.floor(Math.random() * Math.min(50, maxOrderOf(S.level) * 2));
  S.orders.push({
    id: uid(), side, price, amount, filled: 0,
    owner: BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)],
    mine: false, ts: Date.now(),
  });
}

function initBots(){
  for(let i = 0; i < 6; i++) botOrder();
}

/* ============== МАТЧИНГ ============== */
function matchAll(){
  const eps = 0.001;
  const sells = S.orders.filter(o => o.side === 'sell' && o.filled < o.amount - eps).sort((a,b) => a.price - b.price || a.ts - b.ts);
  const buys  = S.orders.filter(o => o.side === 'buy'  && o.filled < o.amount - eps).sort((a,b) => b.price - a.price || a.ts - b.ts);

  let si = 0, bi = 0;
  let anyTrade = false;

  while(si < sells.length && bi < buys.length){
    const s = sells[si];
    const b = buys[bi];
    if(s.price > b.price + eps) break;

    const sRem = s.amount - s.filled;
    const bRem = b.amount - b.filled;
    const vol = Math.min(sRem, bRem);
    if(vol <= eps) { si++; bi++; continue; }

    // Сделка по цене продавца (кто раньше поставил — тот и определил цену)
    const dealPrice = s.price;
    const usd = vol * dealPrice;

    // Обновляем балансы, если участвует игрок
    if(s.mine){ S.balTG -= vol; S.balUSD += usd; }
    if(b.mine){ S.balUSD -= usd; S.balTG += vol; }

    // Комиссия игрока (платформа) со сделки
    const comm = usd * rateOf(S.level) / 100;
    S.earned += comm;
    if(s.mine || b.mine) S.myFilled += vol;

    s.filled += vol;
    b.filled += vol;

    pushLog(`💥 ${s.mine?'🧑 ':'🤖 '}${s.owner} → ${b.mine?'🧑 ':'🤖 '}${b.owner}: ${fmtBig(vol)} TG × ${fmt(dealPrice,2)} = ${fmt(usd,2)} T (комиссия +${fmt(comm,4)})`);
    anyTrade = true;

    if(s.filled >= s.amount - eps) si++;
    if(b.filled >= b.amount - eps) bi++;
  }

  // Убираем полностью исполненные
  S.orders = S.orders.filter(o => o.filled < o.amount - eps);

  // Ограничим размер книги
  if(S.orders.length > 200) S.orders = S.orders.slice(-200);

  if(anyTrade) renderAll();
}

/* ============== ЛОГ ============== */
function pushLog(txt){
  const time = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  S.log.unshift({t:time, txt});
  if(S.log.length > 25) S.log.length = 25;
  renderLog();
}

/* ============== РЕНДЕР ============== */
function renderTop(){
  document.getElementById('balTG').textContent = fmtBig(S.balTG);
  document.getElementById('balUSD').textContent = fmtBig(S.balUSD);
  document.getElementById('earned').textContent = fmt(S.earned, 2);
  document.getElementById('profName').textContent = RANKS[S.level-1];
  document.getElementById('commRate').textContent = rateOf(S.level).toFixed(1) + '%';
  document.getElementById('maxOrd').textContent = fmtBig(maxOrderOf(S.level));
  document.getElementById('priceDisplay').textContent = fmt(S.price, 2);
}

function renderBook(){
  const eps = 0.001;
  const sells = S.orders.filter(o => o.side === 'sell' && o.filled < o.amount - eps).sort((a,b) => a.price - b.price || a.ts - b.ts).slice(0, 25);
  const buys  = S.orders.filter(o => o.side === 'buy'  && o.filled < o.amount - eps).sort((a,b) => b.price - a.price || a.ts - b.ts).slice(0, 25);

  const sb = document.getElementById('sellBook');
  const bb = document.getElementById('buyBook');

  sb.innerHTML = sells.length ? sells.map(o => `
    <div class="order sell ${o.mine?'mine':''}">
      <div class="l">
        <div class="p">${fmt(o.price,2)} $</div>
        <div class="a">${fmtBig(o.amount - o.filled)} TG • ${o.mine?'🧑 вы':o.owner}</div>
      </div>
      ${o.mine ? `<span class="x" onclick="cancelOrder('${o.id}')">✕</span>` : ''}
    </div>`).join('') : '<div class="empty">Нет ордеров</div>';

  bb.innerHTML = buys.length ? buys.map(o => `
    <div class="order buy ${o.mine?'mine':''}">
      <div class="l">
        <div class="p">${fmt(o.price,2)} $</div>
        <div class="a">${fmtBig(o.amount - o.filled)} TG • ${o.mine?'🧑 вы':o.owner}</div>
      </div>
      ${o.mine ? `<span class="x" onclick="cancelOrder('${o.id}')">✕</span>` : ''}
    </div>`).join('') : '<div class="empty">Нет ордеров</div>';
}

function renderLog(){
  const el = document.getElementById('logList');
  if(!S.log.length){ el.innerHTML = '<div class="info" style="text-align:center;padding:10px">Ждём первых сделок…</div>'; return; }
  el.innerHTML = S.log.map(l => `<div class="log-line"><span class="tm">[${l.t}]</span><span style="flex:1;text-align:right">${l.txt}</span></div>`).join('');
}

function renderAll(){ renderTop(); renderBook(); }

/* ============== ФОРМА ОРДЕРА ============== */
function setSide(s){
  S.side = s;
  document.getElementById('btnBuy').classList.toggle('active', s === 'buy');
  document.getElementById('btnSell').classList.toggle('active', s === 'sell');
  updatePreview();
}
function updatePreview(){
  const p = parseFloat(document.getElementById('ordPrice').value) || 0;
  const a = parseFloat(document.getElementById('ordAmount').value) || 0;
  document.getElementById('ordTotal').textContent = fmt(p * a, 2);
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('ordPrice').addEventListener('input', updatePreview);
  document.getElementById('ordAmount').addEventListener('input', updatePreview);
});

function submitOrder(){
  const price = parseFloat(document.getElementById('ordPrice').value);
  const amount = parseFloat(document.getElementById('ordAmount').value);
  if(!Number.isFinite(price) || price <= 0){ toast('Некорректная цена', false); return; }
  if(!Number.isFinite(amount) || amount <= 0){ toast('Некорректное количество', false); return; }

  const usd = price * amount;
  if(usd > maxOrderOf(S.level) * 5){ // не больше 5× от лимита — анти-чит
    toast(`Ордер слишком большой для ${RANKS[S.level-1]}`, false);
    return;
  }

  if(S.side === 'buy'){
    if(S.balUSD < usd){ toast(`Мало TUSD: нужно ${fmt(usd,2)}`, false); return; }
  } else {
    if(S.balTG < amount){ toast(`Мало TG: нужно ${fmtBig(amount)}`, false); return; }
  }

  S.orders.push({
    id: uid(), side: S.side, price, amount, filled: 0,
    owner: 'вы', mine: true, ts: Date.now(),
  });
  pushLog(`📝 ${S.side === 'buy' ? '🟩' : '🟥'} Ваш ордер: ${fmtBig(amount)} TG × ${fmt(price,2)} $`);
  toast('🚀 Ордер размещён', true);
  renderAll();
  // Немедленный матчинг
  setTimeout(matchAll, 50);
}

function cancelOrder(id){
  const i = S.orders.findIndex(o => o.id === id && o.mine);
  if(i < 0) return;
  const o = S.orders[i];
  S.orders.splice(i, 1);
  pushLog(`✕ Отменён ордер: ${fmtBig(o.amount - o.filled)} TG × ${fmt(o.price,2)} $`);
  renderAll();
}

/* ============== РОСТ ЦЕНЫ ============== */
function growPrice(){
  const oldPrice = S.price;
  S.price = S.price * 1.01; // +1%
  S.nextGrowthAt = Date.now() + 30000;
  pushLog(`📈 Курс TG: ${fmt(oldPrice,2)} → ${fmt(S.price,2)} $ (+1%)`);

  const el = document.getElementById('priceDisplay');
  el.classList.add('up');
  setTimeout(() => el.classList.remove('up'), 1200);

  renderTop();
}

function updateGrowthTimer(){
  const left = Math.max(0, Math.ceil((S.nextGrowthAt - Date.now()) / 1000));
  document.getElementById('growthTimer').textContent = left;
}

/* ============== ИНИЦИАЛИЗАЦИЯ ============== */
let matchTimer, botTimer, growTimer, timerTick;

document.addEventListener('DOMContentLoaded', () => {
  initBots();
  renderAll();
  renderLog();
  updatePreview();
  updateGrowthTimer();

  // Матчинг каждые 700 мс
  matchTimer = setInterval(matchAll, 700);

  // Боты добавляют ордера каждые ~3 сек
  botTimer = setInterval(() => {
    const n = 1 + Math.floor(Math.random() * 2);
    for(let i = 0; i < n; i++) botOrder();
    renderBook();
  }, 3000);

  // Рост цены раз в 30 сек
  growTimer = setInterval(growPrice, 30000);

  // Тик таймера роста
  timerTick = setInterval(updateGrowthTimer, 500);

  // Автоподстройка цены в форме под текущий курс
  setInterval(() => {
    const inp = document.getElementById('ordPrice');
    if(!inp || document.activeElement === inp) return;
    inp.value = fmt(S.price, 2);
    updatePreview();
  }, 5000);
});
</script>
</body>
</html>
