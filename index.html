<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💱 P2P Автоматизация — ДЕМО</title>
<style>
:root{--bg:#0b1018;--card:#141c28;--line:#39475b;--gold:#f4cf70;--text:#fff;--muted:#9da9b9;--green:#39d98a;--red:#ff647c;--blue:#4f8cff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#26334a 0,#0b1018 42%),#0b1018;color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:600px;margin:auto;padding:14px 12px 30px}
h1{text-align:center;color:var(--gold);margin:6px 0 2px;font-size:20px}
.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:12px}
.card{background:linear-gradient(145deg,#1b2636,#111925);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 8px 20px #0006}
.card.gold{border-color:#80652b}
.title{color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:.6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
button{padding:11px;border-radius:11px;border:0;background:linear-gradient(135deg,#f5d477,#c99629);color:#17120a;font-weight:bold;font-size:14px;cursor:pointer}
button.ok{background:linear-gradient(135deg,#39d98a,#2ba86a);color:#0d280d;width:100%;padding:13px}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=number]{width:100%;padding:10px;border-radius:11px;border:1px solid #45536a;background:#0d1520;color:#fff;font-size:14px;outline:none}
input[type=range]{width:100%;margin:8px 0;accent-color:#f4cf70;height:6px}
label{display:block;color:#aeb8c6;font-size:11px;margin-bottom:5px;margin-top:8px}
.info{color:var(--muted);font-size:11px;line-height:1.4}
.ok{color:var(--green)}.er{color:var(--red)}.gold{color:var(--gold)}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tab{flex:1;padding:8px 4px;border-radius:10px;background:#0d1520;border:1px solid #2d3a4c;color:#9da9b9;font-size:12px;font-weight:bold;cursor:pointer;text-align:center;transition:.15s}
.tab.active{background:linear-gradient(145deg,#2a2415,#1a160d);border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px #f4cf7044}
.price-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0}
.price-big{font-size:36px;font-weight:bold;color:#fff;line-height:1;letter-spacing:-1px;transition:color .3s}
.price-big.up{color:#39d98a;text-shadow:0 0 20px #39d98a88}
.price-big.down{color:#ff647c;text-shadow:0 0 20px #ff647c88}
.price-unit{color:#8f9bab;font-size:14px}
.price-meta{display:flex;justify-content:space-between;font-size:11px;padding:0 4px;margin-bottom:8px}
#chart{display:block;width:100%;height:120px;border-radius:10px;background:#0d1520;border:1px solid #2d3a4c}
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bal{background:#0d1520;border:1px solid #2d3a4c;border-radius:11px;padding:10px}
.bal span{font-size:11px;color:#8f9bab;display:block}
.bal b{font-size:16px;color:#fff;display:block;margin-top:3px}
.bal.gold{border-color:#66572e;background:linear-gradient(145deg,#25200e,#14110a)}
.bal.gold b{color:var(--gold)}
.side-toggle{display:flex;gap:6px;margin-bottom:6px}
.side-btn{flex:1;padding:11px;font-size:12px;font-weight:bold;border-radius:11px;border:1px solid #45536a;background:#0d1520;color:#9da9b9;cursor:pointer;transition:.15s}
.side-btn.buy.active{background:linear-gradient(145deg,#1f4a2f,#0d2818);color:#39d98a;border-color:#39d98a;box-shadow:0 0 12px #39d98a55}
.side-btn.sell.active{background:linear-gradient(145deg,#4a1f2f,#280d18);color:#ff647c;border-color:#ff647c;box-shadow:0 0 12px #ff647c55}
.quick-pcts{display:flex;gap:5px;margin-top:6px}
.quick-pcts button{flex:1;padding:7px 4px;font-size:11px;background:#1b2636;color:#cfd8e4;border:1px solid #3a4658;border-radius:8px}
.preview{background:#0d1520;border:1px solid #303d50;border-radius:11px;padding:10px;margin:10px 0;font-size:12px}
.preview>div{display:flex;justify-content:space-between;padding:3px 0}
.preview b{color:#f4cf70;font-size:14px}
.book-head{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px}
.bh{font-size:11px;font-weight:bold;letter-spacing:.5px;padding:5px;border-radius:7px;text-align:center}
.bh.sell{background:#4a1f2f;color:#ff647c}
.bh.buy{background:#1f4a2f;color:#39d98a}
.book{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px}
.col{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:100px}
.empty{color:#4a596d;text-align:center;font-size:10px;padding:20px 4px}
.order{padding:6px 8px;border-radius:8px;font-size:10px;display:flex;justify-content:space-between;align-items:center;gap:5px;border:1px solid transparent;position:relative}
.order.sell{background:linear-gradient(145deg,#2a1515,#1a0d0d);border-color:#4a2424;color:#ffb3b3}
.order.buy{background:linear-gradient(145deg,#152a1f,#0d1a13);border-color:#244a34;color:#a8e6b9}
.order.mine{border-color:var(--gold);box-shadow:0 0 8px #f4cf7055}
.order .l{flex:1;min-width:0}
.order .p{font-weight:bold;font-size:11px}
.order .a{font-size:9px;color:#8f9bab;margin-top:1px}
.order .x{cursor:pointer;color:#8f9bab;font-size:12px;padding:0 3px}
.log-list{display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto;font-size:10px}
.log-line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a2534}
.log-line:last-child{border:0}
.log-line .tm{color:#7f8c9f;margin-right:5px;flex-shrink:0}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:4000;padding:11px;border-radius:11px;background:#1b2737;border:1px solid #4c5b70;text-align:center;font-size:12px;display:none}
.toast.show{display:block;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div class="app">
  <h1>💱 P2P АВТОМАТИЗАЦИЯ</h1>
  <div class="sub">ДЕМО • Живой рынок • Курс растёт от покупок</div>

  <div class="card gold">
    <div class="title">📈 КУРС</div>
    <div class="tabs">
      <button class="tab active" data-token="TG">🥇 TG</button>
      <button class="tab" data-token="AI">🤖 AI</button>
      <button class="tab" data-token="VK">🎮 VK</button>
    </div>
    <div class="price-wrap">
      <div class="price-big" id="priceBig">100.00</div>
      <div class="price-unit">TUSD</div>
    </div>
    <div class="price-meta">
      <span id="startChange" class="info">от старта: 0%</span>
      <span id="earnedInfo" class="ok">💵 0.00 T</span>
    </div>
    <canvas id="chart" height="120"></canvas>
  </div>

  <div class="card">
    <div class="title">💰 БАЛАНС</div>
    <div class="bal-grid">
      <div class="bal"><span>🥇 TG</span><b id="balTG">10</b></div>
      <div class="bal"><span>🤖 AI</span><b id="balAI">50K</b></div>
      <div class="bal"><span>🎮 VK</span><b id="balVK">500</b></div>
      <div class="bal gold"><span>💵 TUSD</span><b id="balTUSD">5000.00</b></div>
    </div>
  </div>

  <div class="card">
    <div class="title">📝 НОВЫЙ ОРДЕР • <span id="tokenLabel">🥇 TG</span></div>
    <div class="side-toggle">
      <button id="btnBuy" class="side-btn buy active" onclick="setSide('buy')">🟩 КУПИТЬ</button>
      <button id="btnSell" class="side-btn sell" onclick="setSide('sell')">🟥 ПРОДАТЬ</button>
    </div>
    <label>Цена за 1 <span id="unitLabel">TG</span> (TUSD)</label>
    <input id="ordPrice" type="number" step="0.000001" value="100">
    <label>Объём: <b id="pctLabel" style="color:#f4cf70">25%</b></label>
    <input id="pctSlider" type="range" min="1" max="100" value="25" step="1">
    <div class="quick-pcts">
      <button onclick="setPct(10)">10%</button>
      <button onclick="setPct(25)">25%</button>
      <button onclick="setPct(50)">50%</button>
      <button onclick="setPct(75)">75%</button>
      <button onclick="setPct(100)">100%</button>
    </div>
    <div class="preview">
      <div><span>Кол-во:</span><b id="ordAmountDisp">—</b></div>
      <div><span>Сумма:</span><b id="ordTotalDisp">—</b></div>
    </div>
    <button class="ok" onclick="submitOrder()">🚀 РАЗМЕСТИТЬ ОРДЕР</button>
  </div>

  <div class="card">
    <div class="title">📖 КНИГА ОРДЕРОВ<span class="info" style="font-size:10px">● live</span></div>
    <div class="book-head">
      <div class="bh sell">SELL 🟥</div>
      <div class="bh buy">BUY 🟩</div>
    </div>
    <div class="book">
      <div class="col" id="sellBook"></div>
      <div class="col" id="buyBook"></div>
    </div>
  </div>

  <div class="card">
    <div class="title">⚡ ЛЕНТА СДЕЛОК</div>
    <div id="logList" class="log-list"><div class="info" style="text-align:center;padding:10px">Ждём сделок…</div></div>
  </div>
</div>

<script>
/* ================= КОНФИГ ================= */
const TOKENS = {
  TG: { decimals: 2, start: 100 },
  AI: { decimals: 4, start: 0.01 },
  VK: { decimals: 2, start: 2 },
};
const BOT_NAMES = ['Вася','Петя','Иван','Маша','Олег','Коля','Аня','Дима','Катя','Саша','Лена','Гриша','Толя','Юля'];
const PRICE_UP = 1.01;
const PRICE_DOWN = 0.995;

/* ================= СОСТОЯНИЕ ================= */
const S = {
  price: { TG: 100, AI: 0.01, VK: 2 },
  startPrice: { TG: 100, AI: 0.01, VK: 2 },
  history: { TG: [100], AI: [0.01], VK: [2] },
  bal: { TG: 10, AI: 50000, VK: 500, TUSD: 5000 },
  orders: [],
  log: [],
  activeToken: 'TG',
  side: 'buy',
  pct: 25,
  earned: 0,
};

/* ================= УТИЛИТЫ ================= */
function uid(){ return 'o' + Math.random().toString(36).slice(2,10); }
function fmt(v, d=2){ return Number(v).toFixed(d); }
function fmtBig(v){
  const n = Number(v);
  if(n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.?0+$/,'') + 'K';
  return String(Math.round(n*10000)/10000);
}
function toast(t, ok=false){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.style.borderColor = ok ? '#397b5b' : '#4c5b70';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1900);
}
function pushLog(txt){
  const time = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  S.log.unshift({t:time, txt});
  if(S.log.length > 25) S.log.length = 25;
  renderLog();
}

/* ================= БОТЫ ================= */
function botOrder(token){
  const mid = S.price[token];
  const side = Math.random() < 0.5 ? 'buy' : 'sell';
  let price;
  if(side === 'sell') price = mid * (1.01 + Math.random() * 0.03);
  else                price = mid * (0.97 + Math.random() * 0.02);
  if(Math.random() < 0.15) price = mid * (1 + (Math.random() - 0.5) * 0.008);

  const d = TOKENS[token].decimals;
  price = Math.round(price * Math.pow(10, d)) / Math.pow(10, d);

  const maxVol = token === 'AI' ? 5000 : (token === 'VK' ? 100 : 20);
  const amount = 1 + Math.floor(Math.random() * maxVol);

  S.orders.push({
    id: uid(), side, price, amount, filled: 0, token,
    owner: BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)],
    mine: false, ts: Date.now(),
  });
}

function initBots(){
  for(const t of Object.keys(TOKENS)){
    for(let i = 0; i < 5; i++) botOrder(t);
  }
}

/* ================= МАТЧИНГ ================= */
function matchAll(){
  let anyTrade = false;
  const eps = 1e-9;

  for(const token of Object.keys(TOKENS)){
    let safety = 200;
    while(safety-- > 0){
      const sells = S.orders.filter(o => o.token === token && o.side === 'sell' && o.filled < o.amount - eps)
                            .sort((a,b) => a.price - b.price || a.ts - b.ts);
      const buys  = S.orders.filter(o => o.token === token && o.side === 'buy'  && o.filled < o.amount - eps)
                            .sort((a,b) => b.price - a.price || a.ts - b.ts);
      if(!sells.length || !buys.length) break;
      const s = sells[0], b = buys[0];
      if(s.price > b.price + eps) break;

      const sRem = s.amount - s.filled;
      const bRem = b.amount - b.filled;
      const vol = Math.min(sRem, bRem);
      const dealPrice = s.price;
      const usd = vol * dealPrice;

      if(s.mine){ S.bal[token] -= vol; S.bal.TUSD += usd; }
      if(b.mine){ S.bal.TUSD -= usd; S.bal[token] += vol; }

      S.earned += usd * 0.01;

      s.filled += vol;
      b.filled += vol;

      pushLog(`💥 ${s.mine?'🧑':'🤖'}${s.owner} → ${b.mine?'🧑':'🤖'}${b.owner}: ${fmtBig(vol)} ${token} × ${fmt(dealPrice, TOKENS[token].decimals)} = ${fmt(usd,2)} T`);
      anyTrade = true;
    }
  }

  S.orders = S.orders.filter(o => o.filled < o.amount - eps);
  if(S.orders.length > 300) S.orders = S.orders.slice(-300);

  return anyTrade;
}

/* ================= ЦЕНА ================= */
function bumpPrice(token, mult){
  S.price[token] *= mult;
  S.history[token].push(S.price[token]);
  if(S.history[token].length > 60) S.history[token].shift();

  if(token === S.activeToken){
    const el = document.getElementById('priceBig');
    el.classList.remove('up','down');
    el.classList.add(mult > 1 ? 'up' : 'down');
    setTimeout(() => el.classList.remove('up','down'), 800);
  }
}

/* ================= ГРАФИК ================= */
function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 340;
  const H = 120;
  if(canvas.width !== W*dpr || canvas.height !== H*dpr){
    canvas.width = W*dpr;
    canvas.height = H*dpr;
    canvas.style.height = H + 'px';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const data = S.history[S.activeToken];
  const decimals = TOKENS[S.activeToken].decimals;

  if(!data || data.length < 2){
    ctx.fillStyle = '#4a596d';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Мало данных — сделай сделку', W/2, H/2);
    return;
  }

  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = (max - min) || (max * 0.02) || 1;
  const padT = 14, padB = 18, padL = 8, padR = 8;
  const plotH = H - padT - padB;
  const plotW = W - padL - padR;
  const stepX = plotW / Math.max(1, data.length - 1);
  const X = i => padL + i * stepX;
  const Y = v => padT + plotH - ((v - min) / range) * plotH;

  ctx.strokeStyle = '#1f2a3b';
  ctx.lineWidth = 1;
  ctx.setLineDash([2,4]);
  [min, (min+max)/2, max].forEach(v => {
    ctx.beginPath();
    ctx.moveTo(padL, Y(v));
    ctx.lineTo(W - padR, Y(v));
    ctx.stroke();
  });
  ctx.setLineDash([]);

  const isUp = data[data.length-1] >= data[0];
  const color = isUp ? '#39d98a' : '#ff647c';

  const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
  grad.addColorStop(0, color + '66');
  grad.addColorStop(1, color + '00');
  ctx.beginPath();
  ctx.moveTo(X(0), Y(data[0]));
  data.forEach((v,i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(data.length-1), H - padB);
  ctx.lineTo(X(0), H - padB);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(X(0), Y(data[0]));
  data.forEach((v,i) => ctx.lineTo(X(i), Y(v)));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  const lx = X(data.length-1), ly = Y(data[data.length-1]);
  ctx.beginPath();
  ctx.arc(lx, ly, 5, 0, Math.PI*2);
  ctx.fillStyle = color + '55';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(lx, ly, 2.5, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.fillStyle = '#7f8c9f';
  ctx.font = '9px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(fmt(max, decimals), padL + 2, padT + 8);
  ctx.fillText(fmt(min, decimals), padL + 2, H - padB - 3);
  ctx.textAlign = 'right';
  ctx.fillText(data.length + ' точек', W - padR - 2, H - padB - 3);
}

/* ================= РЕНДЕР ================= */
function renderTop(){
  document.getElementById('balTG').textContent = fmtBig(S.bal.TG);
  document.getElementById('balAI').textContent = fmtBig(S.bal.AI);
  document.getElementById('balVK').textContent = fmtBig(S.bal.VK);
  document.getElementById('balTUSD').textContent = fmt(S.bal.TUSD, 2);

  document.getElementById('tokenLabel').textContent = TOKENS[S.activeToken] ? '' : '';
  document.getElementById('tokenLabel').textContent = document.querySelector(`.tab[data-token="${S.activeToken}"]`).textContent;
  document.getElementById('unitLabel').textContent = S.activeToken;
  document.getElementById('priceBig').textContent = fmt(S.price[S.activeToken], TOKENS[S.activeToken].decimals);

  const chg = (S.price[S.activeToken] / S.startPrice[S.activeToken] - 1) * 100;
  const chgEl = document.getElementById('startChange');
  chgEl.textContent = `от старта: ${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`;
  chgEl.className = chg >= 0 ? 'ok' : 'er';

  document.getElementById('earnedInfo').textContent = `💵 ${fmt(S.earned, 2)} T`;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.token === S.activeToken);
  });

  document.getElementById('pctLabel').textContent = S.pct + '%';
  document.getElementById('pctSlider').value = S.pct;

  drawChart();
  updatePreview();
}

function renderBook(){
  const token = S.activeToken;
  const eps = 1e-9;
  const sells = S.orders.filter(o => o.token === token && o.side === 'sell' && o.filled < o.amount - eps)
                        .sort((a,b) => a.price - b.price || a.ts - b.ts).slice(0, 25);
  const buys  = S.orders.filter(o => o.token === token && o.side === 'buy'  && o.filled < o.amount - eps)
                        .sort((a,b) => b.price - a.price || a.ts - b.ts).slice(0, 25);

  const sb = document.getElementById('sellBook');
  const bb = document.getElementById('buyBook');
  const d = TOKENS[token].decimals;

  sb.innerHTML = sells.length ? sells.map(o => `
    <div class="order sell ${o.mine?'mine':''}">
      <div class="l">
        <div class="p">${fmt(o.price, d)}</div>
        <div class="a">${fmtBig(o.amount - o.filled)} ${token} • ${o.mine?'вы':o.owner}</div>
      </div>
      ${o.mine ? `<span class="x" onclick="cancelOrder('${o.id}')">✕</span>` : ''}
    </div>`).join('') : '<div class="empty">Нет продавцов</div>';

  bb.innerHTML = buys.length ? buys.map(o => `
    <div class="order buy ${o.mine?'mine':''}">
      <div class="l">
        <div class="p">${fmt(o.price, d)}</div>
        <div class="a">${fmtBig(o.amount - o.filled)} ${token} • ${o.mine?'вы':o.owner}</div>
      </div>
      ${o.mine ? `<span class="x" onclick="cancelOrder('${o.id}')">✕</span>` : ''}
    </div>`).join('') : '<div class="empty">Нет покупателей</div>';
}

function renderLog(){
  const el = document.getElementById('logList');
  if(!S.log.length){ el.innerHTML = '<div class="info" style="text-align:center;padding:10px">Ждём сделок…</div>'; return; }
  el.innerHTML = S.log.map(l => `<div class="log-line"><span class="tm">[${l.t}]</span><span style="flex:1;text-align:right">${l.txt}</span></div>`).join('');
}

function renderAll(){
  renderTop();
  renderBook();
}

/* ================= ФОРМА ================= */
function setToken(t){
  S.activeToken = t;
  const inp = document.getElementById('ordPrice');
  inp.value = fmt(S.price[t], TOKENS[t].decimals);
  renderTop();
  renderBook();
}

function setSide(s){
  S.side = s;
  document.getElementById('btnBuy').classList.toggle('active', s === 'buy');
  document.getElementById('btnSell').classList.toggle('active', s === 'sell');
  updatePreview();
}

function setPct(p){
  S.pct = Math.max(1, Math.min(100, p));
  renderTop();
}

function computeOrder(){
  const token = S.activeToken;
  const price = parseFloat(document.getElementById('ordPrice').value) || S.price[token];
  const pct = S.pct / 100;

  if(S.side === 'buy'){
    const availUSD = S.bal.TUSD;
    const usd = availUSD * pct;
    const amount = usd / price;
    return { token, price, amount, usd };
  } else {
    const availTok = S.bal[token];
    const amount = availTok * pct;
    const usd = amount * price;
    return { token, price, amount, usd };
  }
}

function updatePreview(){
  const { token, amount, usd } = computeOrder();
  document.getElementById('ordAmountDisp').textContent = fmtBig(amount) + ' ' + token;
  document.getElementById('ordTotalDisp').textContent = fmt(usd, 2) + ' TUSD';
}

/* ================= ОРДЕР ================= */
function submitOrder(){
  const token = S.activeToken;
  const inp = document.getElementById('ordPrice');
  const price = parseFloat(inp.value);
  if(!Number.isFinite(price) || price <= 0){ toast('Некорректная цена'); return; }

  const { amount, usd } = computeOrder();
  if(amount <= 0){ toast('Нулевой объём'); return; }

  if(S.side === 'buy'){
    if(usd > S.bal.TUSD + 1e-6){ toast(`Мало TUSD: нужно ${fmt(usd,2)}`); return; }
  } else {
    if(amount > S.bal[token] + 1e-6){ toast(`Мало ${token}: нужно ${fmt(amount, 4)}`); return; }
  }

  const ord = {
    id: uid(), side: S.side, price, amount, filled: 0, token,
    owner: 'вы', mine: true, ts: Date.now(),
  };
  S.orders.push(ord);

  matchAll();
  const didFill = ord.filled > 1e-9;

  if(didFill){
    bumpPrice(token, S.side === 'buy' ? PRICE_UP : PRICE_DOWN);
    toast(S.side === 'buy' ? `🟩 Куплено • курс +1%` : `🟥 Продано • курс −0.5%`, true);
  } else {
    toast('📝 Ордер в книге — ждёт встречный');
  }

  pushLog(`📝 Вы: ${S.side === 'buy' ? '🟩 покупка' : '🟥 продажа'} ${fmtBig(amount)} ${token} × ${fmt(price, TOKENS[token].decimals)}`);

  renderAll();
}

function cancelOrder(id){
  const i = S.orders.findIndex(o => o.id === id && o.mine);
  if(i < 0) return;
  const o = S.orders[i];
  S.orders.splice(i, 1);
  pushLog(`✕ Отменён: ${fmtBig(o.amount - o.filled)} ${o.token} × ${fmt(o.price, TOKENS[o.token].decimals)}`);
  renderAll();
}

/* ================= ЦИКЛЫ ================= */
function botTick(){
  const tokens = Object.keys(TOKENS);
  botOrder(tokens[Math.floor(Math.random()*tokens.length)]);
  if(Math.random() < 0.5) botOrder(tokens[Math.floor(Math.random()*tokens.length)]);
  renderBook();
}

function matchTick(){
  const didMatch = matchAll();
  if(didMatch) renderAll();
}

/* ================= ИНИТ ================= */
document.addEventListener('DOMContentLoaded', () => {
  initBots();
  matchAll();

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => setToken(t.dataset.token);
  });
  document.getElementById('pctSlider').addEventListener('input', e => {
    S.pct = parseInt(e.target.value) || 1;
    document.getElementById('pctLabel').textContent = S.pct + '%';
    updatePreview();
  });
  document.getElementById('ordPrice').addEventListener('input', updatePreview);

  document.getElementById('ordPrice').value = fmt(S.price[S.activeToken], TOKENS[S.activeToken].decimals);

  renderAll();
  renderLog();

  setInterval(botTick, 1500);
  setInterval(matchTick, 600);
  setInterval(() => {
    document.getElementById('earnedInfo').textContent = `💵 ${fmt(S.earned, 2)} T`;
  }, 1000);
  window.addEventListener('resize', drawChart);
});
</script>
</body>
